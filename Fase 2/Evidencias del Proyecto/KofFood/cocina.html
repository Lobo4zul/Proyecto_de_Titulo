<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vista Cocina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
    <a class="navbar-brand" href="#"><img src="assets/logo.jpg" alt="Logo" width="80" /></a>
    <div class="mx-auto">
      <button class="btn btn-outline-primary mx-2" onclick="verNuevos()">Nuevos</button>
      <button class="btn btn-outline-secondary mx-2" onclick="verPendientes()">Pedidos Pendientes</button>
    </div>
    <div>
      <a href="index.html" class="btn btn-outline-dark">← Volver a Usuario</a>
    </div>
  </nav>

  <div class="container my-4" id="vistaCocina">
    <h4 class="text-center">Selecciona una opción</h4>
  </div>

  <script>
    let pedidosPendientes = [];

    function getComandas() {
      return JSON.parse(localStorage.getItem('comandas')) || [];
    }

    function verNuevos() {
      const comandas = getComandas();
      const contenedor = document.getElementById('vistaCocina');
      contenedor.innerHTML = '<h4 class="mb-3">Nuevos Pedidos</h4>';

      if (comandas.length === 0) {
        contenedor.innerHTML += '<p>No hay nuevos pedidos.</p>';
        return;
      }

      comandas.forEach((pedido, index) => {
        const div = document.createElement('div');
        div.className = 'border p-3 mb-3';
        div.innerHTML = `
          <strong>Cliente Nº ${pedido.cliente}</strong><br />
          ${pedido.items.map(i => `${i.nombre} x ${i.cantidad}`).join('<br />')}
          <br /><button class="btn btn-success mt-2" onclick="aceptarPedido(${index}, this)">Aceptar</button>
        `;
        contenedor.appendChild(div);
      });
    }

    function aceptarPedido(index, btn) {
      btn.classList.add('boton-aceptado');
      btn.disabled = true;
      btn.textContent = 'Aceptado';

      const comandas = getComandas();
      pedidosPendientes.push(comandas[index]);

      comandas.splice(index, 1);
      localStorage.setItem('comandas', JSON.stringify(comandas));
    }

    function verPendientes() {
      const contenedor = document.getElementById('vistaCocina');
      contenedor.innerHTML = '<h4 class="mb-3">Pedidos Pendientes</h4>';

      if (pedidosPendientes.length === 0) {
        contenedor.innerHTML += '<p>No hay pedidos pendientes.</p>';
        return;
      }

      pedidosPendientes.forEach((pedido, index) => {
        const div = document.createElement('div');
        div.className = 'border p-3 mb-3';
        div.innerHTML = `
          <strong>Cliente Nº ${pedido.cliente}</strong><br />
          ${pedido.items.map(i => `${i.nombre} x ${i.cantidad}`).join('<br />')}
          <br /><button class="btn btn-danger mt-2" onclick="marcarListo(${index})">Listo</button>
        `;
        contenedor.appendChild(div);
      });
    }

    function marcarListo(index) {
      pedidosPendientes.splice(index, 1);
      verPendientes();
    }
  </script>
</body>
</html>
